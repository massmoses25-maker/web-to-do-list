<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>My To Do List</h1>

    <div class="input-group">
     <input id="taskInput" type="text"
     placeholder="Enter you task!..">
     <button id="addButton">+Add task</button>
    </div>

    <ul id="taskList" class="task-list">
        <li class="task-item">
            Belajar untuk ulangan
            <button>Delete</button>
        </li>
        <li class="task-item">
            Belanja keperluan ikan
            <button>Delete</button>
        </li>
        <li class="task-item">
            Mencuci motor
            <button>Delete</button>
        </li>
    </ul>

        <p class="sumary-task">Kamu punya beberapa task di minggu ini!!</p>

</div>

    <script src="belajar1.js"></script>
</body>
</html>
